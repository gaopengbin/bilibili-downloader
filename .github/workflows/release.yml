name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Download yt-dlp
        run: Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "src-tauri/yt-dlp.exe"

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp"
          $ffmpegDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)/bin/ffmpeg.exe" "src-tauri/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg-temp", "ffmpeg.zip"

      - name: Download aria2c
        run: |
          Invoke-WebRequest -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile "aria2.zip"
          Expand-Archive -Path "aria2.zip" -DestinationPath "aria2-temp"
          $aria2Dir = Get-ChildItem -Path "aria2-temp" -Directory | Select-Object -First 1
          Copy-Item "$($aria2Dir.FullName)/aria2c.exe" "src-tauri/aria2c.exe"
          Remove-Item -Recurse -Force "aria2-temp", "aria2.zip"

      - name: Build
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Get version
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable zip
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "src-tauri/target/release/bilibili-downloader.exe" -DestinationPath "bilibili-downloader_${version}_x64_portable.zip"

      - name: Generate latest.json
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $nsisSig = Get-Content "src-tauri/target/release/bundle/nsis/bilibili-downloader_${version}_x64-setup.exe.sig" -Raw
          $latest = @{
            version = "v$version"
            notes = "请查看更新日志了解详情"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $nsisSig.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/bilibili-downloader_${version}_x64-setup.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 10 | Set-Content "latest.json" -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 'B站视频下载器 v${{ steps.version.outputs.VERSION }}'
          body: |
            ## 下载
            
            | 版本 | 文件 | 说明 |
            |------|------|------|
            | 🚀 便携版 | `bilibili-downloader_${{ steps.version.outputs.VERSION }}_x64_portable.zip` | 解压即用，无需安装 |
            | 📦 安装版 | `bilibili-downloader_${{ steps.version.outputs.VERSION }}_x64-setup.exe` | 支持应用内自动更新 |
            
            ## 更新内容
            
            请查看 [更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) 了解详情。
          files: |
            bilibili-downloader_${{ steps.version.outputs.VERSION }}_x64_portable.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
